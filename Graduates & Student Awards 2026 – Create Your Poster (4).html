<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graduates &amp; Student Awards 2026 – Create Your Poster</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;color:#f6ecd0;background:linear-gradient(160deg,#07302d,#0f5a50 60%,#3b2a1a);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;text-align:center;margin:6px 0 4px;color:#e8c46a}
p.sub{text-align:center;margin:0 0 18px;opacity:.85;font-size:15px}
canvas{width:100%;height:auto;border-radius:14px;box-shadow:0 12px 40px #0008;touch-action:none;cursor:grab;display:block}
.card{background:#ffffff14;border:1px solid #e8c46a55;border-radius:16px;padding:16px;margin-top:16px;backdrop-filter:blur(6px)}
label{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#e8c46a;margin:12px 0 6px}
label:first-child{margin-top:0}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid #e8c46a88;background:#00000040;color:#fff;font:inherit;font-size:16px}
input[type=range]{width:100%;accent-color:#e8c46a}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;font:inherit;font-size:17px;font-weight:bold;cursor:pointer;text-align:center}
.up{background:#ffffff1f;color:#f6ecd0;border:1px dashed #e8c46a}
.dl{background:linear-gradient(135deg,#f1d98a,#c9962f);color:#2b1c0b;margin-top:16px}
.hint{font-size:13px;opacity:.7;text-align:center;margin-top:8px}
</style></head><body>
<div class="wrap">
<h1>Create Your Event Poster</h1>
<p class="sub">Add your photo and name, then download and share!</p>
<canvas id="c" width="1080" height="1080"></canvas>
<div class="hint">Drag the photo to reposition it</div>
<div class="card">
<label>Your photo</label>
<label class="btn up" for="f" style="text-transform:none;letter-spacing:0;color:#f6ecd0;margin:0">📷 Upload your photo</label>
<input id="f" type="file" accept="image/*" hidden>
<label>Zoom</label>
<input id="z" type="range" min="1" max="3" step="0.01" value="1">
<label>Your name</label>
<input id="n" type="text" maxlength="32" placeholder="Enter your name">
<button class="btn dl" id="d">⬇ Download Poster</button>
</div>
</div>
